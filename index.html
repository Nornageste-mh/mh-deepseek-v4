<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MH-DeepSeek V4</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:#0f0f0f;color:#ececec;min-height:100vh;display:flex;overflow:hidden;}
        .sidebar{width:280px;background:#1a1a1a;border-right:1px solid #2a2a2a;display:flex;flex-direction:column;padding:16px 12px;height:100vh;position:sticky;top:0;overflow-y:auto;transition:transform 0.3s ease;z-index:100;}
        .sidebar-header{padding:0 4px 16px;display:flex;flex-direction:column;gap:12px;}
        .new-chat-btn{background:#2a2a2a;border:1px solid #3a3a3a;color:#fff;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background 0.2s;width:100%;justify-content:flex-start;}
        .new-chat-btn:hover{background:#3a3a3a;}
        .session-groups{flex:1;overflow-y:auto;margin-top:16px;}
        .session-group{margin-bottom:24px;}
        .group-title{font-size:12px;color:#888;padding:8px 12px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
        .session-item{background:transparent;padding:10px 12px;border-radius:8px;margin-bottom:2px;cursor:pointer;color:#ccc;font-size:14px;display:flex;align-items:center;justify-content:space-between;transition:background 0.2s;}
        .session-item:hover{background:#2a2a2a;}
        .session-item.active{background:#2b5f8a;color:white;}
        .session-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
        .delete-session{opacity:0;color:#888;font-size:16px;padding:0 4px;transition:opacity 0.2s;}
        .session-item:hover .delete-session{opacity:1;}
        .delete-session:hover{color:#ff5e5e;}
        /* AI 工作中 → 侧边栏灰色不可用 */
        .sidebar.disabled{pointer-events:none;opacity:0.45;}
        .sidebar.disabled .new-chat-btn{cursor:not-allowed;}
        .sidebar.disabled .session-item{cursor:not-allowed;}
        .main{flex:1;display:flex;flex-direction:column;height:100vh;max-width:100%;background:#0f0f0f;position:relative;}
        .chat-header{padding:12px 24px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;background:#0f0f0f;flex-wrap:wrap;gap:8px;}
        .chat-header h1{font-size:20px;font-weight:600;color:#fff;white-space:nowrap;}
        .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
        .identity-badge{background:#1e1e1e;border:1px solid #333;padding:4px 10px;border-radius:16px;font-size:13px;display:flex;align-items:center;gap:4px;cursor:default;}

        .version-text{color:#444;font-size:11px;cursor:default;user-select:none;margin-left:8px;padding:4px 8px;border-radius:4px;}
        .think-toggle.active{background:#2b5f8a;border-color:#4d9eff;color:white;}
        .think-toggle.disabled{opacity:0.35;pointer-events:none;cursor:not-allowed;border-color:#2a2a2a;color:#555;}
        .network-indicator,.think-toggle{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:#1e1e1e;border:1px solid #2a2a2a;cursor:pointer;font-size:12px;color:#ccc;transition:all 0.2s;}
        .model-selector{display:flex;align-items:center;gap:6px;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:20px;padding:2px 8px;font-size:12px;color:#ccc;transition:all 0.2s;}
        .model-selector:hover{background:#2a2a2a;}
        .model-selector select{background:transparent;border:none;color:#fff;font-size:12px;cursor:pointer;outline:none;padding:4px;border-radius:4px;appearance:none;-webkit-appearance:none;}
        .model-selector select option{background:#1a1a1a;color:#fff;}
        #providerSelect{color:#aaa;font-size:11px;max-width:80px;text-overflow:ellipsis;}
        #modelSelect{max-width:140px;}
        .meiju-warning{display:none;color:#ffaa44;font-size:10px;}
        .model-selector.meiju #providerSelect{color:#ffaa44;}
        .messages-container{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch;}
        .message{display:flex;flex-direction:column;max-width:85%;position:relative;}
        .message.user{align-self:flex-end;}
        .message.assistant{align-self:flex-start;}
        .message-actions{position:absolute;right:0;top:-22px;display:flex;gap:4px;opacity:0;transition:opacity 0.2s;background:#1a1a1a;padding:2px 4px;border-radius:4px;z-index:5;}
        .message:hover .message-actions{opacity:1;}
        .action-btn{background:transparent;border:1px solid #333;color:#aaa;font-size:11px;padding:2px 8px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
        .action-btn:hover{background:#4d9eff;color:white;border-color:#4d9eff;}
        .message-bubble{padding:12px 18px;border-radius:20px;line-height:1.5;word-break:break-word;}
        .user .message-bubble{background:#2b5f8a;color:white;border-bottom-right-radius:4px;}
        .assistant .message-bubble{background:#1e1e1e;border:1px solid #2a2a2a;color:#e0e0e0;border-bottom-left-radius:4px;}
        .reasoning-bubble{background:#1a1a2e;border-left:4px solid #7b68ee;padding:10px 14px;margin-bottom:8px;border-radius:8px;font-size:13px;color:#b0b0d0;}
        .tool-card{background:#1a1a1a;border-left:4px solid #4d9eff;margin:8px 0;border-radius:8px;font-size:13px;overflow:hidden;width:100%;}
        .tool-header{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none;}
        .tool-header:hover{background:#2a2a2a;}
        .tool-status{width:12px;height:12px;border-radius:50%;background:#ffaa44;flex-shrink:0;}
        .tool-status.success{background:#4caf50;}
        .tool-status.error{background:#f44336;}
        .tool-name{font-weight:600;color:#e0e0e0;flex:1;}
        .tool-body{display:none;padding:10px 12px;border-top:1px solid #2a2a2a;}
        .tool-card.expanded .tool-body{display:block;}
        .tool-section{margin-top:8px;}
        .tool-section-title{font-size:12px;color:#888;margin-bottom:4px;}
        .tool-json{background:#0a0a0a;padding:8px;border-radius:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:200px;overflow-y:auto;}
        .auth-card{background:#2a1e2a;border-left:4px solid #ffaa44;padding:12px;border-radius:8px;margin:8px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
        .auth-card button{background:#4d9eff;border:none;color:white;padding:6px 16px;border-radius:20px;cursor:pointer;font-weight:500;}
        .input-area{padding:16px 20px;border-top:1px solid #2a2a2a;background:#0f0f0f;}
        .input-wrapper{display:flex;align-items:flex-end;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:24px;padding:8px 8px 8px 20px;transition:border-color 0.2s;}
        .input-wrapper:focus-within{border-color:#4d9eff;}
        .input-wrapper textarea{flex:1;background:transparent;border:none;color:#fff;font-size:15px;line-height:1.5;resize:none;max-height:120px;outline:none;padding:8px 0;font-family:inherit;}
        .input-wrapper textarea::placeholder{color:#777;}
        .send-btn,.stop-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;flex-shrink:0;margin-left:8px;}
        .send-btn{background:#4d9eff;color:white;}
        .send-btn:hover{background:#3d7ecc;}
        .stop-btn{background:#f44336;color:white;}
        
        .settings-btn{background:transparent;border:1px solid #333;color:#aaa;font-size:16px;padding:2px 8px;border-radius:10px;cursor:pointer;}
        .settings-btn:hover{background:#4d9eff;color:white;border-color:#4d9eff;}
        .settings-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center;}
        .settings-modal.open{display:flex;}
        .settings-panel{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:24px;width:90%;max-width:480px;max-height:85vh;overflow-y:auto;}
        .settings-panel h2{color:#fff;margin:0 0 16px;font-size:20px;}
        .settings-panel label{color:#aaa;font-size:13px;display:block;margin:12px 0 4px;}
        .settings-panel input{width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;padding:10px 12px;border-radius:8px;font-size:14px;}
        .settings-panel input:focus{border-color:#4d9eff;outline:none;}
        .settings-panel .btn-row{display:flex;gap:8px;margin-top:20px;}
        .settings-panel .save-btn{flex:1;background:#4d9eff;border:none;color:white;padding:12px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
        .settings-panel .cancel-btn{flex:1;background:#333;border:none;color:#ccc;padding:12px;border-radius:10px;font-size:15px;cursor:pointer;}
        .settings-panel .status{color:#4caf50;font-size:13px;margin-top:8px;text-align:center;}
        .settings-panel .status.error{color:#f44336;}
        .key-indicator{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
        .key-indicator.set{background:#4caf50;}
        .key-indicator.unset{background:#f44336;}
.menu-toggle{display:none;background:transparent;border:none;color:#fff;font-size:24px;padding:4px;cursor:pointer;}
        @media (max-width:768px){
            .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);box-shadow:2px 0 10px rgba(0,0,0,0.5);}
            .sidebar.open{transform:translateX(0);}
            .main{max-width:100%;}
            .menu-toggle{display:block;}
            .chat-header h1{font-size:16px;}
            .header-actions{gap:4px;}
            .messages-container{padding:12px;}
            .message{max-width:95%;}
        }

        /* ── 语法高亮颜色 ── */
        .hl-keyword{color:#c792ea;}
        .hl-string{color:#c3e88d;}
        .hl-comment{color:#676e95;font-style:italic;}
        .hl-number{color:#f78c6c;}
        .hl-function{color:#82aaff;}

        /* ── Markdown 元素样式 ── */
        .message-bubble h1,.message-bubble h2,.message-bubble h3,
        .message-bubble h4,.message-bubble h5,.message-bubble h6{
            margin:12px 0 6px;line-height:1.3;
        }
        .message-bubble h1{font-size:1.5em;border-bottom:1px solid #333;padding-bottom:6px;}
        .message-bubble h2{font-size:1.3em;border-bottom:1px solid #333;padding-bottom:4px;}
        .message-bubble h3{font-size:1.15em;}
        .message-bubble h4{font-size:1.05em;color:#aaa;}
        .message-bubble p{margin:4px 0;}
        .message-bubble a{color:#4d9eff;text-decoration:underline;}
        .message-bubble a:hover{color:#82b1ff;}
        .message-bubble img{max-width:100%;border-radius:8px;margin:8px 0;}
        .message-bubble hr{border:none;border-top:1px solid #333;margin:12px 0;}
        .message-bubble blockquote{
            border-left:3px solid #4d9eff;margin:8px 0;padding:6px 12px;
            color:#aaa;background:rgba(77,158,255,0.05);border-radius:0 6px 6px 0;
        }
        .message-bubble ul,.message-bubble ol{margin:6px 0;padding-left:24px;}
        .message-bubble li{margin:2px 0;}
        .message-bubble li.task-item{list-style:none;margin-left:-24px;}
        .message-bubble li.task-item input[type="checkbox"]{margin-right:6px;accent-color:#4d9eff;}
        .message-bubble table{
            border-collapse:collapse;margin:8px 0;width:100%;font-size:13px;
        }
        .message-bubble th,.message-bubble td{
            border:1px solid #333;padding:6px 10px;text-align:left;
        }
        .message-bubble th{background:#1a1a2e;font-weight:600;}
        .message-bubble td{background:#121212;}
        .message-bubble code{
            background:#1a1a2e;color:#c3e88d;padding:1px 5px;border-radius:3px;
            font-family:'Cascadia Code','Fira Code','JetBrains Mono',Consolas,monospace;
            font-size:0.9em;
        }
        .message-bubble pre{
            background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;
            padding:14px;margin:10px 0;overflow-x:auto;line-height:1.5;
        }
        .message-bubble pre code{
            background:transparent;padding:0;color:#e0e0e0;font-size:13px;
            white-space:pre;display:block;
        }
        .message-bubble del{color:#888;text-decoration:line-through;}
    </style>
</head>
<body>
    <button class="menu-toggle" id="menuToggle" title="菜单">☰</button>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" id="newSessionBtn"><span style="font-size:18px;">+</span> 新建对话</button>
            <div style="display:flex;align-items:center;justify-content:center;">
                <span class="version-text" id="versionText">v0.5.1</span>
                <span class="identity-badge" id="identityBadge">🤖 Agent</span>
            </div>
        </div>
        <div class="session-groups" id="sessionGroups"></div>
    </div>
    <div class="main">
        <div class="chat-header">
            <h1>🤖 MH-DeepSeek V4</h1>
            <div class="header-actions">
                <div class="network-indicator" id="networkIndicator" title="网络状态">
                    <span class="net-dot" style="width:8px;height:8px;border-radius:50%;background:#ffaa44;"></span>
                    <span class="net-text" style="font-size:11px;">检测中</span>
                </div>
                <div class="model-selector" id="modelSelector">
                    <select id="providerSelect" title="选择提供商"></select>
                    <select id="modelSelect" title="选择模型"></select>
                </div>
                <div class="think-toggle" id="thinkToggle">🧠 思考</div>
                <div class="think-toggle" id="autoDriveToggle">🤖 自动驾驶</div>
                <button class="settings-btn" id="settingsBtn" title="设置">⚙️</button>
                <button class="action-btn" id="clearBtn" title="清空会话" style="margin-left:0;">🗑️</button>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div class="empty-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#666;">
                <h3>MH-DeepSeek V4</h3><p style="font-size:14px;margin:8px 0;">通用智能体 · 工具拉满 · Android兼容</p><p style="font-size:13px;color:#555;">输入指令开始对话</p>
            </div>
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="发送消息..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
                
            </div>
        </div>
    </div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-panel">
            <h2>⚙️ API 密钥设置</h2>
            <div id="keysStatus" style="margin-bottom:12px;font-size:12px;color:#888;"></div>
            <label>DeepSeek API Key <span class="key-indicator" id="dsIndicator"></span></label>
            <input type="password" id="dsKey" placeholder="sk-...">
            <label>博查搜索 API Key <span class="key-indicator" id="boIndicator"></span></label>
            <input type="password" id="boKey" placeholder="sk-...">
            <label style="margin-top:16px;color:#666;">── 妹居DeepSeek 账号（非API Key）──</label>
            <label>手机号</label>
            <input type="text" id="meijuPhone" placeholder="17600000001">
            <label>密码</label>
            <input type="password" id="meijuPass" placeholder="登录密码">
            <div class="btn-row">
                <button class="cancel-btn" id="settingsCancelBtn">取消</button>
                <button class="save-btn" id="settingsSaveBtn">💾 保存</button>
            </div>
            <div class="status" id="settingsStatus"></div>
        </div>
    </div>


    <script>
        // ═══════════════════════════════════════════════
        // 完整 Markdown 解析器 + 语法高亮（纯 JS，零依赖）
        // ═══════════════════════════════════════════════
        function parseMarkdown(text){
            if(!text) return '';
            // 转义 HTML 防止 XSS
            let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

            // ── 代码块（提取保护，避免内部被解析）──
            const codeBlocks = [];
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code){
                const idx = codeBlocks.length;
                codeBlocks.push({lang: lang || '', code: code.trimEnd()});
                return '\x00CODE' + idx + '\x00';
            });

            // ── 行内代码 ──
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // ── 标题 ──
            html = html.replace(/^###### (.+)$/gm, '<h6>$1</h6>');
            html = html.replace(/^##### (.+)$/gm, '<h5>$1</h5>');
            html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // ── 水平线 ──
            html = html.replace(/^(---|\*\*\*|___)\s*$/gm, '<hr>');

            // ── 粗体 / 斜体 / 删除线 ──
            html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.+?)_/g, '<em>$1</em>');
            html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

            // ── 链接 / 图片 ──
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;">');
            html = html.replace(/\[([^\]]*)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

            // ── 引用块 ──
            html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
            html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

            // ── 无序列表 ──
            html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

            // ── 有序列表 ──
            html = html.replace(/^\d+\. (.+)$/gm, '<oli>$1</oli>');
            html = html.replace(/((?:<oli>.*<\/oli>\n?)+)/g, function(m){
                return '<ol>' + m.replace(/<\/?oli>/g, function(t){
                    return t === '<oli>' ? '<li>' : '</li>';
                }) + '</ol>';
            });

            // ── 任务列表 ──
            html = html.replace(/<li>\[ \] (.+)<\/li>/g, '<li class="task-item"><input type="checkbox" disabled> $1</li>');
            html = html.replace(/<li>\[x\] (.+)<\/li>/gi, '<li class="task-item"><input type="checkbox" checked disabled> $1</li>');

            // ── 表格 ──
            html = html.replace(/^\|(.+)\|\s*\n\|[\-\s|:]+\|\s*\n((?:\|.+\|\s*\n?)+)/gm, function(_, header, body){
                const hcells = header.split('|').filter(c => c.trim()).map(c => '<th>' + c.trim() + '</th>').join('');
                const rows = body.trim().split('\n').map(row => {
                    const cells = row.split('|').filter(c => c.trim()).map(c => '<td>' + c.trim() + '</td>').join('');
                    return '<tr>' + cells + '</tr>';
                }).join('');
                return '<table><thead><tr>' + hcells + '</tr></thead><tbody>' + rows + '</tbody></table>';
            });

            // ── 段落与换行 ──
            html = html.replace(/\n\n+/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>(\s*<br>\s*)*<\/p>/g, '');

            // ── 恢复代码块（带语法高亮）──
            html = html.replace(/\x00CODE(\d+)\x00/g, function(_, idx){
                const cb = codeBlocks[parseInt(idx)];
                const lang = cb.lang.toLowerCase();
                const highlighted = highlightCode(cb.code, lang);
                const langClass = lang ? ' class="language-' + lang + '"' : '';
                return '<pre><code' + langClass + '>' + highlighted + '</code></pre>';
            });

            return html;
        }

        // ═══════════════════════════════════════════════
        // 纯 JS 语法高亮器（零依赖）
        // ═══════════════════════════════════════════════
        function highlightCode(code, lang){
            const raw = code.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
            const esc = function(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

            const patterns = getLangPatterns(lang);
            if(!patterns) return code;

            const protected_regions = [];
            let result = raw;
            patterns.strings.forEach(function(p){
                result = result.replace(p.regex, function(m){
                    const i = protected_regions.length;
                    protected_regions.push('<span class="hl-string">' + esc(m) + '</span>');
                    return '\x01S' + i + '\x01';
                });
            });
            patterns.comments.forEach(function(p){
                result = result.replace(p.regex, function(m){
                    const i = protected_regions.length;
                    protected_regions.push('<span class="hl-comment">' + esc(m) + '</span>');
                    return '\x01C' + i + '\x01';
                });
            });

            result = result.replace(/\b(\d+\.?\d*)\b/g, function(m){
                const i = protected_regions.length;
                protected_regions.push('<span class="hl-number">' + m + '</span>');
                return '\x01N' + i + '\x01';
            });

            if(patterns.keywords){
                const kwRe = new RegExp('\\b(' + patterns.keywords.join('|') + ')\\b', 'g');
                result = result.replace(kwRe, '<span class="hl-keyword">$1</span>');
            }

            result = result.replace(/\b([a-zA-Z_]\w*)(?=\s*\()/g, '<span class="hl-function">$1</span>');

            result = result.replace(/\x01([SCN])(\d+)\x01/g, function(_, type, idx){
                return protected_regions[parseInt(idx)] || '';
            });

            return result;
        }

        function getLangPatterns(lang){
            const p = {strings:[],comments:[],keywords:null};

            case 'python': case 'py':
                p.strings=[{regex:/("""[\s\S]*?""")/g},{regex:/('''[\s\S]*?''')/g},{regex:/(f?"(?:[^"\\]|\\.)*")/g},{regex:/(f?'(?:[^'\\]|\\.)*')/g}];
                p.comments=[{regex:/(#.*$)/gm}];
                p.keywords=['False','None','True','and','as','assert','async','await','break','class','continue','def','del','elif','else','except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield','print','range','len','int','str','float','list','dict','set','tuple','self','open','Exception','TypeError','ValueError'];

            case 'javascript': case 'js': case 'ts': case 'typescript':
                p.strings=[{regex:/(`[\s\S]*?`)/g},{regex:/("(?:[^"\\]|\\.)*")/g},{regex:/('(?:[^'\\]|\\.)*')/g}];
                p.comments=[{regex:/(\/\/.*$)/gm},{regex:/(\/\*[\s\S]*?\*\/)/g}];
                p.keywords=['const','let','var','function','return','if','else','for','while','do','switch','case','break','continue','new','this','typeof','instanceof','class','extends','super','import','export','default','async','await','try','catch','finally','throw','null','undefined','true','false','from','of','in','yield','Promise','Array','Object','Map','Set','console','document','window'];
                break;
            case 'bash': case 'sh': case 'shell':
                p.strings=[{regex:/("(?:[^"\\]|\\.)*")/g},{regex:/('(?:[^'\\]|\\.)*')/g}];
                p.comments=[{regex:/(#.*$)/gm}];
                p.keywords=['if','then','else','elif','fi','for','while','do','done','case','esac','in','function','return','exit','export','local','source','echo','cd','ls','pwd','mkdir','rm','cp','mv','cat','grep','find','chmod','chown','sudo','apt','yum','pip','npm','git','docker','curl','wget','tar','unzip','python','node','bash','sh'];
                break;
            case 'json':
                p.strings=[{regex:/("(?:[^"\\]|\\.)*")/g}];
                p.keywords=['true','false','null'];
                break;
            case 'html': case 'xml':
                p.strings=[{regex:/("(?:[^"\\]|\\.)*")/g},{regex:/('(?:[^'\\]|\\.)*')/g}];
                p.comments=[{regex:/(<!--[\s\S]*?-->)/g}];
                break;
            case 'css':
                p.strings=[{regex:/("(?:[^"\\]|\\.)*")/g},{regex:/('(?:[^'\\]|\\.)*')/g}];
                p.comments=[{regex:/(\/\*[\s\S]*?\*\/)/g}];
                p.keywords=['px','em','rem','vh','vw','%','rgb','rgba','none','auto','inherit','initial','unset','important','flex','grid','block','inline','absolute','relative','fixed','sticky'];
                break;
            case 'sql':
                p.strings=[{regex:/('(?:[^'\\]|\\.)*')/g}];
                p.comments=[{regex:/(--.*$)/gm}];
                p.keywords=['SELECT','FROM','WHERE','INSERT','UPDATE','DELETE','CREATE','DROP','ALTER','TABLE','INTO','VALUES','SET','AND','OR','NOT','NULL','JOIN','LEFT','RIGHT','INNER','OUTER','ON','AS','ORDER','BY','GROUP','HAVING','LIMIT','OFFSET','UNION','ALL','DISTINCT','COUNT','SUM','AVG','MAX','MIN','LIKE','BETWEEN','IN','EXISTS','PRIMARY','KEY','FOREIGN','select','from','where','insert','update','delete','create','drop','alter','table','into','values','set','and','or','not','null','join','left','right','inner','outer','on','as','order','by','group','having','limit','offset'];
                break;
            case 'yaml': case 'yml':
                p.comments=[{regex:/(#.*$)/gm}];
                p.keywords=['true','false','null','yes','no'];
                break;
            default:
                if(!lang) return null;
                p.comments=[{regex:/(#.*$)/gm},{regex:/(\/\/.*$)/gm}];
                p.strings=[{regex:/("(?:[^"\\]|\\.)*")/g},{regex:/('(?:[^'\\]|\\.)*')/g}];

        // 通用 SSE 流处理函数（供 regenerate / continue / 正常发送 复用）
        window.handleStreamResponse = function(resp) {
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let partial = '';
            let currentAssistantCard = null, currentReasoningCard = null,
                contentBuffer = '', reasoningBuffer = '',
                hasPendingToolCall = false, lastInsertedElement = null;
            const myStreamId = currentStreamId || Date.now();
            function finishSending() {
                // 仅当自身仍是当前流时才重置状态
                if (currentStreamId !== myStreamId) return;
                isSending = false;
                sidebar.classList.remove('disabled');
                sendBtn.style.display = '';
                activeReader = null;
                currentStreamId = null;
                loadSessions();
            }
            return (async function() {
                try {
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        partial += decoder.decode(value, { stream: true });
                        const lines = partial.split('\n');
                        partial = lines.pop() || '';
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const raw = line.slice(6);
                                if (raw === '[DONE]') break;
                                try {
                                    const obj = JSON.parse(raw);
                                    if (obj.type === 'content') {
                                        if (hasPendingToolCall) {
                                            currentAssistantCard = null;
                                            currentReasoningCard = null;
                                            contentBuffer = '';
                                            reasoningBuffer = '';
                                            hasPendingToolCall = false;
                                            lastInsertedElement = null;
                                        }
                                        contentBuffer += obj.chunk;
                                        if (!currentAssistantCard) {
                                            currentAssistantCard = createMessageCard('assistant', '', true);
                                            lastInsertedElement = currentAssistantCard;
                                        }
                                        currentAssistantCard.querySelector('.message-bubble').innerHTML =
                                            parseMarkdown(contentBuffer);
                                        scrollToBottom();
                                    } else if (obj.type === 'reasoning') {
                                        if (hasPendingToolCall) {
                                            currentAssistantCard = null;
                                            currentReasoningCard = null;
                                            contentBuffer = '';
                                            reasoningBuffer = '';
                                            hasPendingToolCall = false;
                                            lastInsertedElement = null;
                                        }
                                        reasoningBuffer += obj.chunk;
                                        if (!currentReasoningCard) {
                                            currentReasoningCard = createReasoningCard('');
                                            lastInsertedElement = currentReasoningCard;
                                        }
                                        currentReasoningCard.querySelector('.reasoning-bubble').innerHTML =
                                            '<strong>🧠 思考过程</strong><br>' +
                                            reasoningBuffer.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                                        scrollToBottom();
                                    } else if (obj.type === 'tool_preparing') {
                                        // 创建工具卡片，状态"准备执行"（白色圆点）
                                        const tempId = 'prep_' + obj.name;
                                        const card = createToolCardElement(tempId, obj.name, {}, null);
                                        card.querySelector('.tool-detail span:first-child').textContent = '准备执行...';
                                        card.querySelector('.tool-status').style.background = '#fff';
                                        messagesContainer.appendChild(card);
                                        scrollToBottom();
                                        // 按名称暂存，等待 tool_call 关联真实 ID
                                        if (!window._prepByName) window._prepByName = {};
                                        window._prepByName[obj.name] = {card, tempId};
                                    } else if (obj.type === 'tool_call') {
                                        obj.calls.forEach(call => {
                                            // 复用准备卡片的 DOM，关联真实 tool_call_id
                                            const prep = window._prepByName && window._prepByName[call.name];
                                            if (prep && prep.card && prep.card.parentNode) {
                                                // 更新 pendingToolCards: 从 tempId 迁移到真实 call.id
                                                const oldRef = pendingToolCards.get(prep.tempId);
                                                if (oldRef) {
                                                    pendingToolCards.set(call.id, oldRef);
                                                    pendingToolCards.delete(prep.tempId);
                                                    // 更新参数显示（之前是空 {}）
                                                    let args = {};
                                                    try { args = JSON.parse(call.arguments); } catch (e) {}
                                                    if (oldRef.argsPre) oldRef.argsPre.textContent = JSON.stringify(args, null, 2);
                                                    // 更新 toolCallId 到 DOM
                                                    const toolDiv = oldRef.card.querySelector('.tool-card');
                                                    if (toolDiv) toolDiv.dataset.toolCallId = call.id;
                                                    oldRef.detailSpan.innerHTML = '<span>执行中...</span><span class="tool-expand-icon">▼</span>';
                                                    oldRef.statusSpan.style.background = ''; // 恢复黄色脉冲
                                                    lastInsertedElement = prep.card;
                                                    delete window._prepByName[call.name];
                                                    scrollToBottom();
                                                    return; // 复用成功，不创建新卡片
                                                }
                                            }
                                            // 没有准备卡片 → 新建
                                            let args = {};
                                            try { args = JSON.parse(call.arguments); } catch (e) {}
                                            const toolCard = createToolCardElement(call.id, call.name, args, null);
                                            // 工具卡片创建时默认为"准备执行"，这里直接切为"执行中"
                                            const ref = pendingToolCards.get(call.id);
                                            if (ref) {
                                                ref.detailSpan.innerHTML = '<span>执行中...</span><span class="tool-expand-icon">▼</span>';
                                                ref.statusSpan.style.background = '';
                                            }
                                            if (lastInsertedElement) {
                                                lastInsertedElement.insertAdjacentElement('afterend', toolCard);
                                                lastInsertedElement = toolCard;
                                            } else {
                                                messagesContainer.appendChild(toolCard);
                                                lastInsertedElement = toolCard;
                                            }
                                            scrollToBottom();
                                        });
                                        hasPendingToolCall = true;
                                    } else if (obj.type === 'tool_result') {
                                        updateToolResult(obj.tool_call_id, obj.result);
                                    } else if (obj.type === 'auth_required') {
                                        createAuthCard(obj.command, () => sendMessage('AUTH_APPROVE'));
                                    } else if (obj.type === 'stopped') {
                                        createMessageCard('assistant', '⏸ 输出已被中断', false);
                                    } else if (obj.type === 'error') {
                                        // 如果是 400 类格式错误，显示 AI 修复按钮
                                        const errorMsg = obj.error || '';
                                        if (errorMsg.includes('400') || errorMsg.includes('tool_calls') || errorMsg.includes('tool_call_id') || errorMsg.includes('insufficient')) {
                                            const errorDiv = document.createElement('div');
                                            errorDiv.className = 'message assistant';
                                            errorDiv.innerHTML = '<div class="message-bubble" style="background:#3a2a2a;border:1px solid #ff5555;border-left:4px solid #ff5555;">' +
                                                '❌ ' + errorMsg.replace(/\n/g, '<br>') +
                                                '<br><br><button onclick="aiFixAndRetry()" style="padding:6px 16px;background:#7c4dff;border:none;color:white;border-radius:20px;cursor:pointer;font-weight:500;">🛠 AI 修复</button> ' +
                                                '<button onclick="emergencyRestart()" style="padding:6px 16px;background:#ff6d00;border:none;color:white;border-radius:20px;cursor:pointer;font-weight:500;">🔄 紧急重启</button>' +
                                                '</div>';
                                            messagesContainer.appendChild(errorDiv);
                                            scrollToBottom();
                                        } else {
                                            createMessageCard('assistant', '❌ ' + obj.error, false);
                                        }
                                    } else if (obj.type === 'recovery') {
                                        const r = obj.recovery;
                                        const recoveryHtml = '<div class="message assistant"><div class="message-bubble" style="background:#2a3a2a;border:1px solid #4caf50;border-left:4px solid #4caf50;">🔄 <strong>自动恢复</strong><br><span style="font-size:13px;">' + (r.message||'') + '</span>' + (r.action?'<br><span style="font-size:12px;color:#888;">恢复动作: '+r.action+'</span>':'') + '</div></div>';
                                        messagesContainer.insertAdjacentHTML('beforeend', recoveryHtml);
                                        scrollToBottom();
                                    } else if (obj.type === 'retry_info') {
                                        const ri = obj.retry_info;
                                        const retryHtml = '<div class="message assistant"><div class="message-bubble" style="background:#2a2a1e;border:1px solid #ffaa44;border-left:4px solid #ffaa44;">⏳ <strong>重试中...</strong><br><span style="font-size:13px;">等待 '+ri.wait+' 秒后重试 (第 '+ri.attempt+'/'+ri.max_retries+' 次)</span>' + (ri.error_type?'<br><span style="font-size:12px;color:#888;">错误类型: '+ri.error_type+'</span>':'') + '</div></div>';
                                        messagesContainer.insertAdjacentHTML('beforeend', retryHtml);
                                        scrollToBottom();
                                    }
                                } catch (e) {
                                    console.error('Parse error:', e);
                                }
                            }
                        }
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        createMessageCard('assistant', '❌ 连接中断: ' + err.message, false);
                    }
                } finally {
                    finishSending();
                }
            })();
        };

        window.aiFixAndRetry = async function() {
            if (!currentSessionId) return;
            try {
                const resp = await fetch('/api/sessions/' + currentSessionId + '/ai_fix', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identity: currentIdentity })
                });
                const data = await resp.json();
                if (data.success) {
                    // 移除错误卡片
                    const lastMsg = messagesContainer.lastElementChild;
                    if (lastMsg && lastMsg.classList.contains('message')) {
                        lastMsg.remove();
                    }
                    // 重新加载会话历史
                    const histResp = await fetch('/api/sessions/' + currentSessionId + '/history?identity=' + currentIdentity);
                    const history = await histResp.json();
                    renderHistoryMessages(history);
                    createMessageCard('assistant', '✅ AI 修复完成，请重新输入消息继续对话', false);
                } else {
                    alert('AI 修复失败: ' + (data.message || '未知错误'));
                }
            } catch (e) {
                console.error('AI fix error:', e);
                alert('AI 修复请求失败: ' + e.message);
            }
        };
        window.emergencyRestart = async function() {
            if (!currentSessionId) return;
            if (!confirm('紧急重启将用 AI 摘要替换当前对话历史。之前的对话内容会被压缩为摘要，最后一条消息会保留。确定要重启吗？')) return;
            try {
                const resp = await fetch('/api/sessions/' + currentSessionId + '/emergency_restart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identity: currentIdentity })
                });
                const data = await resp.json();
                if (data.success) {
                    const lastMsg = messagesContainer.lastElementChild;
                    if (lastMsg && lastMsg.classList.contains('message')) lastMsg.remove();
                    const histResp = await fetch('/api/sessions/' + currentSessionId + '/history?identity=' + currentIdentity);
                    renderHistoryMessages(await histResp.json());
                    createMessageCard('assistant', '上下文已重建，请重新输入消息继续对话', false);
                } else {
                    alert('紧急重启失败: ' + (data.message || '未知错误'));
                }
            } catch (e) {
                console.error('Emergency restart error:', e);
                alert('紧急重启请求失败: ' + e.message);
            }
        };

        // 发送消息主函数
        async function sendMessage(text, continueMode = false) {
            if (!text && !continueMode) return;
            // 如果正在输出，取消旧流并等待其 finally 执行
            if (isSending && activeReader) {
                try { activeReader.cancel(); } catch(e) {}
                await new Promise(r => setTimeout(r, 100)); // 等旧流 finally 完成
                activeReader = null;
                isSending = false;
                sidebar.classList.remove('disabled');
                sendBtn.style.display = '';
            }
            // 如果没有当前会话，自动创建一个
            if (!currentSessionId && !continueMode) {
                await createNewSession();
            }
            if (!continueMode) {
                messageInput.value = '';
                messageInput.style.height = 'auto';
                createMessageCard('user', text, false);
            }
            isSending = true;
            sidebar.classList.add('disabled');
            sendBtn.style.display = 'none';
                        try {
                const resp = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: currentSessionId, think_mode: thinkMode, continue_mode: continueMode, identity: currentIdentity, auto_drive: autoDrive })
                });
                currentStreamId = resp.headers.get('X-Stream-ID');
                window.handleStreamResponse(resp);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    clearEmptyState();
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'message assistant';
                    const msgId = 'recover-' + Date.now();
                    errorDiv.innerHTML = '<div class="message-bubble" style="background:#3a2a2a;border:1px solid #ff5555;">' +
                        '❌ 连接中断: ' + err.message + '<br>' +
                        '<button onclick="retryStream(\'' + msgId + '\',\'' + (text||'').replace(/'/g,"\\'") + '\')" style="margin-top:8px;padding:4px 12px;background:#4d9eff;border:none;color:white;border-radius:4px;">重新发送</button>' +
                        '</div>';
                    errorDiv.id = msgId;
                    messagesContainer.appendChild(errorDiv);
                    scrollToBottom();
                }
                isSending = false;
                sidebar.classList.remove('disabled');
                sendBtn.style.display = '';
                                activeReader = null;
                currentStreamId = null;
                loadSessions();
            }
        }

        async function stopGeneration() {
            if (currentStreamId) {
                await fetch('/chat/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stream_id: currentStreamId }) });
            }
            if (activeReader) {
                activeReader.cancel();
                activeReader = null;
            }
            isSending = false;
            sidebar.classList.remove('disabled');
            sendBtn.style.display = '';
                        currentStreamId = null;
        }

        // 会话管理 & UI
        async function loadSessions() {
            const res = await fetch(`/api/sessions?identity=${currentIdentity}`);
            const sessions = await res.json();
            const groups = groupByDate(sessions);
            sessionGroups.innerHTML = '';
            for (const [group, items] of Object.entries(groups)) {
                if (!items.length) continue;
                const gDiv = document.createElement('div');
                gDiv.className = 'session-group';
                gDiv.innerHTML = '<div class="group-title">' + group + '</div>';
                items.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'session-item' + (currentSessionId === s.id ? ' active' : '');
                    div.innerHTML = '<span class="session-title">💬 ' + (s.title || '新对话') + '</span><span class="delete-session" data-sid="' + s.id + '">✕</span>';
                    div.querySelector('.delete-session').addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (confirm('删除此会话？')) {
                            await fetch(`/api/sessions/${s.id}?identity=${currentIdentity}`, { method: 'DELETE' });
                            if (currentSessionId === s.id) {
                                currentSessionId = null;
                                messagesContainer.innerHTML = '<div class="empty-state"><h3>MH-DeepSeek V4</h3><p>选择一个会话</p></div>';
                            }
                            loadSessions();
                        }
                    });
                    div.addEventListener('click', () => switchSession(s.id));
                    gDiv.appendChild(div);
                });
                sessionGroups.appendChild(gDiv);
            }
            if (!sessions.length && !window._isCreatingSession) await createNewSession();
            else if (!currentSessionId) await switchSession(sessions[0].id);
        }

        function groupByDate(sessions) {
            const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const groups = { '今天': [], '昨天': [], '7天内': [], '更早': [] };
            sessions.forEach(s => {
                const d = new Date(s.updated_at).getTime();
                if (d >= today) groups['今天'].push(s);
                else if (d >= today - 86400000) groups['昨天'].push(s);
                else if (d >= today - 7 * 86400000) groups['7天内'].push(s);
                else groups['更早'].push(s);
            });
            return groups;
        }
        async function createNewSession() {
            if (isSending) return;
            const res = await fetch('/api/sessions/new', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identity: currentIdentity, provider_id: currentProvider, model_id: currentModel }) });
            const data = await res.json();
            currentSessionId = data.session_id;
            renderHistoryMessages([]);
            await loadSessions();
            switchProviderModel();
        }
        async function switchSession(sid) {
            currentSessionId = sid;
            const res = await fetch(`/api/sessions/${sid}/history?identity=${currentIdentity}`);
            const history = await res.json();
            renderHistoryMessages(history);
            loadSessions();
            sidebar.classList.remove('open');
            switchProviderModel();
        }

        function renderHistoryMessages(history) {
            messagesContainer.innerHTML = '';
            messageIndexMap.clear();
            pendingToolCards.clear();
            if (!history.length) {
                messagesContainer.innerHTML = '<div class="empty-state"><h3>MH-DeepSeek V4</h3><p>开始新的对话</p></div>';
                return;
            }
            const toolResults = new Map();
            history.forEach(msg => { if (msg.role === 'tool' && msg.tool_call_id) toolResults.set(msg.tool_call_id, msg.content); });
            let idx = 0;
            history.forEach(msg => {
                if (msg.role === 'system') return;
                const currentIdx = idx++;
                if (msg.role === 'user') {
                    createMessageCard('user', msg.content || '', false, currentIdx);
                } else if (msg.role === 'assistant') {
                    let content = msg.content || '', reasoning = '';
                    let rm = content.match(/\[思考过程\]\s*([\s\S]*?)\s*\[\/思考过程\]/);
                    if (rm) {
                        reasoning = rm[1];
                        content = content.replace(/\[思考过程\][\s\S]*?\[\/思考过程\]/, '').trim();
                    }
                    let lastEl = null;
                    if (reasoning) lastEl = createReasoningCard(reasoning);
                    if (content) lastEl = createMessageCard('assistant', content, true, currentIdx);
                    if (msg.tool_calls && msg.tool_calls.length) {
                        msg.tool_calls.forEach(tc => {
                            let args = {};
                            try { args = JSON.parse(tc.function.arguments || '{}'); } catch (e) {}
                            const toolCard = createToolCardElement(tc.id, tc.function.name, args, toolResults.get(tc.id) || null);
                            if (lastEl) {
                                lastEl.insertAdjacentElement('afterend', toolCard);
                                lastEl = toolCard;
                            } else {
                                messagesContainer.appendChild(toolCard);
                                lastEl = toolCard;
                            }
                        });
                    }
                }
            });
            scrollToBottom();
        }

        // 网络状态定时器
        async function checkNetwork() {
            try {
                const res = await fetch('/api/network-status');
                const data = await res.json();
                const dot = document.querySelector('.net-dot');
                const text = document.querySelector('.net-text');
                if (data.online && !data.paused) {
                    dot.style.background = '#4caf50';
                    text.textContent = '在线';
                } else if (data.paused) {
                    dot.style.background = '#ffaa44';
                    text.textContent = '已暂停';
                } else {
                    dot.style.background = '#f44336';
                    text.textContent = '离线';
                }
            } catch (e) {}
        }
        setInterval(checkNetwork, 15000);
        checkNetwork();

        // 按钮绑定
        document.getElementById('newSessionBtn').addEventListener('click', createNewSession);
        document.getElementById('clearBtn').addEventListener('click', async () => {
            if (isSending) return;
            if (confirm('清除当前会话记忆？') && currentSessionId) {
                await fetch('/clear_memory', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: currentSessionId, identity: currentIdentity }) });
                currentSessionId = null;
                messagesContainer.innerHTML = '<div class="empty-state"><h3>MH-DeepSeek V4</h3><p>选择一个会话</p></div>';
                loadSessions();
            }
        });
        sendBtn.addEventListener('click', () => sendMessage(messageInput.value.trim()));
        document.getElementById('autoDriveToggle').addEventListener('click', () => { autoDrive = !autoDrive; document.getElementById('autoDriveToggle').classList.toggle('active', autoDrive); });

        // 初始加载
        loadSessions();
    

        // ======== 设置面板 ========
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const settingsCancelBtn = document.getElementById('settingsCancelBtn');
        const settingsSaveBtn = document.getElementById('settingsSaveBtn');
        const settingsStatus = document.getElementById('settingsStatus');

        settingsBtn.addEventListener('click', openSettings);
        settingsCancelBtn.addEventListener('click', ()=>{settingsModal.classList.remove('open');});
        settingsModal.addEventListener('click', (e)=>{if(e.target===settingsModal)settingsModal.classList.remove('open');});

        async function openSettings(){
            settingsModal.classList.add('open');
            settingsStatus.textContent = '';
            settingsStatus.className = 'status';
            // 查询当前密钥状态
            try{
                const res = await fetch('/api/keys/status');
                const data = await res.json();
                document.getElementById('dsIndicator').className = 'key-indicator ' + (data.deepseek?'set':'unset');
                document.getElementById('boIndicator').className = 'key-indicator ' + (data.bocha?'set':'unset');
                if(!data.initialized){
                    document.getElementById('keysStatus').innerHTML = '<span style="color:#ffaa44;">⚠️ 密钥系统未初始化，首次保存将自动初始化</span>';
                } else {
                    document.getElementById('keysStatus').innerHTML = 'DeepSeek: '+(data.deepseek?'✅ 已设置':'❌ 未设置')+' | 博查: '+(data.bocha?'✅ 已设置':'❌ 未设置')+' | 妹居: '+(data.meiju?'✅ 已设置':'❌ 未设置');
                }
            }catch(e){
                document.getElementById('keysStatus').textContent = '无法获取状态';
            }
        }

        settingsSaveBtn.addEventListener('click', async ()=>{
            const deepseek_key = document.getElementById('dsKey').value.trim();
            const bocha_key = document.getElementById('boKey').value.trim();
            const meiju_phone = document.getElementById('meijuPhone').value.trim();
            const meiju_pass = document.getElementById('meijuPass').value.trim();

            if(!deepseek_key && !bocha_key && !meiju_phone && !meiju_pass){
                settingsStatus.textContent = '请至少填写一项';
                settingsStatus.className = 'status error';
                return;
            }

            settingsSaveBtn.textContent = '保存中...';
            settingsSaveBtn.disabled = true;

            try{
                // 确保密钥系统已初始化
                await fetch('/api/keys/initialize', {method:'POST'});
                
                const res = await fetch('/api/keys/save', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({
                        deepseek_key, bocha_key,
                        meiju_phone, meiju_password: meiju_pass
                    })
                });
                const data = await res.json();
                if(data.success){
                    settingsStatus.textContent = '✅ 密钥已保存并生效！';
                    settingsStatus.className = 'status';
                    document.getElementById('dsKey').value = '';
                    document.getElementById('boKey').value = '';
                    document.getElementById('meijuPass').value = '';
                    setTimeout(()=>{settingsModal.classList.remove('open');}, 1500);
                } else {
                    settingsStatus.textContent = '❌ ' + (data.error || '保存失败');
                    settingsStatus.className = 'status error';
                }
            }catch(e){
                settingsStatus.textContent = '❌ 网络错误: ' + e.message;
                settingsStatus.className = 'status error';
            }
            settingsSaveBtn.textContent = '💾 保存';
            settingsSaveBtn.disabled = false;
        });

</script>
